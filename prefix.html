<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infix to Prefix Converter</title>
  <link rel="stylesheet" href="prefix.css">
</head>
<body>
  <div class="container">
    <h1>🔄 Infix → Prefix Converter</h1>
    <p class="subtitle">Enter any infix expression below and click Convert.</p>

    <div class="input-box">
      <input type="text" id="infix" placeholder="Example: (A+B)*C" />
      <button id="convertBtn">Convert</button>
    </div>

    <div class="output-box">
      <h3>Prefix Expression:</h3>
      <p id="result">—</p>
    </div>
  </div>

  <script src="prefix.js"></script>
</body>
</html>
